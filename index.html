<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>Ikiam Wings Gallery</title>
    <!-- theme before the first paint (no flash): a stored choice (Light or Dark) wins, otherwise the
         system setting, followed live while on System. src/composables/useTheme.js changes it later. -->
    <script>
      (function () {
        var root = document.documentElement
        var mq = window.matchMedia ? window.matchMedia('(prefers-color-scheme: dark)') : null
        var mode = 'system'
        try { mode = localStorage.getItem('wgTheme') || 'system' } catch (e) {}
        if (mode !== 'light' && mode !== 'dark') mode = 'system'
        root.setAttribute('data-wg-theme-mode', mode)
        function apply() {
          var m = root.getAttribute('data-wg-theme-mode')
          var t = m === 'light' || m === 'dark' ? m : (mq && mq.matches ? 'dark' : 'light')
          root.setAttribute('data-bs-theme', t)
          root.style.colorScheme = t
        }
        apply()
        if (mq && mq.addEventListener) mq.addEventListener('change', apply)
        else if (mq && mq.addListener) mq.addListener(apply)
      })()
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
