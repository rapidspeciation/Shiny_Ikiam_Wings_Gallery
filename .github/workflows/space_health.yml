name: HF Space keep-alive + auto-heal

# Two jobs-in-one on a schedule:
#   1. KEEP-ALIVE  - ping /status every 4 h. The free Space only sleeps after 48 h
#                    without traffic (gcTimeout=172800s), so this keeps it warm.
#                    Even a true cold boot is now safe: verified 2026-08-06, fresh
#                    container -> API answering in seconds -> model ready in ~20-30 s.
#   2. AUTO-HEAL   - if the Space is unreachable/errored, query the HF runtime API and,
#                    when it reports RUNTIME_ERROR/PAUSED, POST a restart so it recovers
#                    on its own instead of staying dead until someone notices.
#
# The backend runs the model in an isolated subprocess, so the API process never dies
# and RUNTIME_ERROR should not recur; this workflow is a low-frequency backstop.
# History: originally ran every 10 min, which spun up ~144 runner VMs/day for one curl
# each (and GitHub coalesced it to ~2 h anyway). Reduced to 4 h on 2026-08-06.
#
# SETUP: add a repo secret HF_TOKEN (a Hugging Face token with write access to the
# Space) to enable AUTO-HEAL restarts. Without it, only KEEP-ALIVE runs.

on:
  schedule:
    - cron: '0 */4 * * *'   # every 4 h (GitHub may delay/coalesce scheduled runs)
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: space-health
  cancel-in-progress: false

env:
  SPACE_REPO: fr4nzzch/butterfly-id
  SPACE_URL: https://fr4nzzch-butterfly-id.hf.space

jobs:
  health:
    runs-on: ubuntu-latest
    steps:
      - name: Keep-alive ping (/status)
        id: ping
        run: |
          code=$(curl -s -o /tmp/status.json -w '%{http_code}' -m 30 "$SPACE_URL/status" || echo 000)
          echo "http=$code"
          echo "http=$code" >> "$GITHUB_OUTPUT"
          echo "--- body ---"; cat /tmp/status.json 2>/dev/null || true; echo
          if [ "$code" = "200" ]; then
            stage=$(jq -r '.stage // "unknown"' /tmp/status.json 2>/dev/null || echo unknown)
            echo "Space reachable, stage=$stage"
          fi

      - name: Auto-heal if errored
        if: steps.ping.outputs.http != '200'
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          if [ -z "$HF_TOKEN" ]; then
            echo "Space not healthy (http=${{ steps.ping.outputs.http }}) but no HF_TOKEN secret set -> cannot auto-restart."
            echo "Add an HF_TOKEN repo secret (write access to $SPACE_REPO) to enable auto-heal."
            exit 0
          fi
          echo "Querying HF runtime for $SPACE_REPO ..."
          rt=$(curl -s -m 30 -H "Authorization: Bearer $HF_TOKEN" \
                "https://huggingface.co/api/spaces/$SPACE_REPO/runtime")
          echo "$rt" | jq . 2>/dev/null || echo "$rt"
          stage=$(echo "$rt" | jq -r '.stage // "UNKNOWN"' 2>/dev/null || echo UNKNOWN)
          echo "runtime stage: $stage"
          case "$stage" in
            RUNTIME_ERROR|PAUSED|SLEEPING|STOPPED)
              echo "Restarting Space (stage=$stage) ..."
              out=$(curl -s -m 30 -X POST -H "Authorization: Bearer $HF_TOKEN" \
                    "https://huggingface.co/api/spaces/$SPACE_REPO/restart")
              echo "restart response: $out"
              ;;
            *)
              echo "stage=$stage is not a terminal/paused state; not restarting."
              ;;
          esac
